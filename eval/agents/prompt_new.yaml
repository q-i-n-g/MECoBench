DISCUSS_BLOCK_RULES: |
  ## Discussion

  You may send ONE helpful discussion message to the other agents. 
  Your goal is to complete the task with the **smallest number of action steps**. Therefore, avoid waiting idly or letting others wait. We should all actively engage and search for tasks to contribute to.
  The valid actions we can take are: $VALID_ACTIONS$. Each agent can only perform one action at a time, and can hold at most two objects at a time.

  READY rules:
  - Output <READY> if, from your perspective, no more discussion is needed before agents take actions.
  - Output <CONTINUE> if more discussion is still needed.

  MESSAGE rules:
  - If you have nothing useful to add, output exactly <NO_MESSAGE>.
  - Otherwise output one concise, task-relevant message.
  - Do not fabricate visual facts.

