ACTION_DESC_RESOLVE_PROMPT: |
  You are resolving object_ids for an action based on the class name and descriptions.

  You are given:
  - An action with object names and descriptions.
  - A list of visible candidate objects with ids and class names.
  - A list of holding objects with ids and class names.
  - Two images of the same views:
    1) Raw RGB image.
    2) Bbox-annotated image with class names and object_ids.

  Rules:
  1. Only choose ids from candidates or holding_objects.
  2. Match by class name and description. (The class name is preferred over the description. But if the description makes it very clear that the class-name-matched object is not the referred object, and another candidate is obviously a better fit, should you select that other candidate.)
  3. For put_in / put_on, parameter_ids[0] MUST be the held object, parameter_ids[1] is the target container/surface.
  4. If multiple candidates match, choose the best and most reasonablt fit (if open a fridge, choose the closed one).
  5. If the action is walk_to_room, return the room name in parameter_ids.
  6. If unsure, choose the closest matching candidate rather than returning null.

  Output JSON only (no extra text):
  {
    "action": "<action>",
    "parameter_ids": [<int>, <int>] OR [<int>] OR ["<room>"] OR []
  }

  Input JSON:
  $RESOLVE_INPUT$

PLAN_BLOCK_ANTI_STAGNATION: |
  ## Exploration Strategy

  The target objects are randomly distributed in all rooms — kitchen items (plates, forks, glasses) may be in the livingroom, bedroom, or bathroom, and vice versa.

  ### Rules:
  - **Systematically explore ALL rooms.** After checking all containers and surfaces in the current room, mark it as "explored" in memory and immediately move to the next unexplored room.
  - **Check surfaces, not only containers.** Target objects may be on tables, counters, desks, sofas, or other open surfaces — not only inside containers.
  - **Do NOT stay in one room for too long.** If you have spent more than 6 actions in the same room without finding a target object, move to a different room immediately.
  - **Avoid repeating failed actions.** If you grabbed the wrong object, put it down and carefully re-examine the image before grabbing again. Do not grab the same wrong object twice.
  - **Do NOT keep repeating the same action consecutively.** If an action has already occurred multiple times in a row in the action history, you must choose a completely different action.

WORKER_REPORT_RESTRICTED_ROOMS_HINT: |
  ## Room-access reporting

  In this task, each agent can only access certain rooms.
  - **you MUST state your allowed rooms** so the leader knows which rooms you can access. For example: "My allowed rooms are: kitchen, livingroom. I am currently in the kitchen...."

LEADER_ASSIGNMENT_RESTRICTED_ROOMS_HINT: |
  ## Room-access awareness

  In this task, each agent can only access certain rooms. You and each worker may have DIFFERENT allowed rooms.
  - Pay close attention to the workers and yourself allowed rooms and the department topology when assigning tasks. Only assign tasks to agents that can access the room.
  - When the task requires placing objects in rooms an agent cannot enter, coordinate handovers between agents at connecting doors. But if any worker can complete some subtask in their allowed rooms, you should assign them to do first.
  - If a worker reports handover failed but also says they are at the door, still re-walk both sides once before retrying. This prevents repeated too-far loops caused by stale or incorrect door-location reports.
  - A correct handover assignment should name the exact valid door_id. Avoid vague instructions such as "wait there", "receive", or "meet at the door" after a failure.

PLAN_BLOCK_MEMORY_SHARED: |
  ## Shared Memory Update

  Every agent reads and writes to this SAME memory object. You can use this memory to coordinate with other agents.

  ### Rules:
  - Store only task-relevant objects, containers, and target locations.
  - Update memory using the current observation and previous action feedback. Do NOT record the action you are about to output as completed yet.
  - If new information conflicts with existing memory, correct the memory to reflect the latest belief.
  - Keep memory concise and consistent. Memory represents the current belief state, not a full history. Do not invent objects.
  - Keep agent_locations, agent_plans, agent_status, agent_holding, task_progress, and claims updated so other agents can coordinate.
  - Read shared memory before acting to avoid redundant exploration and action conflicts.
  - Prefer unassigned subtasks instead of repeating work another agent is already doing. If all visible subtasks are claimed, deliver any object you hold to its target, explore a different unchecked place, or wait instead of duplicating the same target.
  - Track multi-count goals by required, satisfied, and remaining counts. Mark a subtask satisfied only when the environment feedback or satisfied task list confirms the object is at the target.
  - Use claims to reserve one concrete next subtask per agent, including the object name, source location, target location, and state: "planned", "holding", "delivering", or "done".
  - Do not update or guess another agent's status, holdings, or completed actions.

  ### MEMORY Output format
  Memory MUST be a JSON object with no extra text:
  {
    "livingroom": {
      "exploration": "unexplored|partially_explored|explored",
      "objects": [{"name": "...", "description": "...", "location": "...", "status": "..."}],
      "containers": [{"name": "...", "description": "...", "location": "...", "status": "unchecked|checked|open|closed"}],
      "notes": []
    },
    "kitchen": { ... },
    "bedroom": { ... },
    "bathroom": { ... },
    "global": {
      "notes": [],
      "agent_locations": {"<agent_name>": "", ...},
      "agent_plans": {"<agent_name>": "", ...},
      "agent_status": {"<agent_name>": "", ...},
      "agent_holding": {"<agent_name>": [{"name": "...", "source": "...", "target": "..."}], ...},
      "task_progress": {"<goal_key>": {"required": 0, "satisfied": 0, "remaining": 0}},
      "claims": [{"agent": "<agent_name>", "object": "...", "source": "...", "target": "...", "state": "planned|holding|delivering|done"}],
      "coordination_board": ["", ...]
    }
  }
