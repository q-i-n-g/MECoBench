PLAN_BLOCK_COMMUNICATION: |
  ## Communication

  Send a message if it is helpful for task progress and remain silent if the message would be redundant, speculative, or misleading.
  Your goal is to complete the task with the **smallest number of action steps**. Therefore, avoid waiting or letting others wait. We should all actively engage and search for tasks to contribute to.
  The valid actions we can take are: $VALID_ACTIONS$. Each agent can only perform one action at a time, and can hold at most two objects at a time. 

  ### MESSAGE Output Format
  - If silent, output exactly:
    <NO_MESSAGE>
  - Otherwise, output the message text ONLY.

COMM_BLOCK_RESTRICTED_HANDOVER: |
  ## Handover Protocol

  Agent-to-agent handover may be required to finish the task.
  If two agents are in different rooms, the handover meeting point MUST be the door between those rooms.

  ### Step-by-step handover procedure
  1. **Communicate first**: agree on which door to meet at (use the door_id from department topology) The door should between the two rooms the two agents are allowed to access.
  2. **Walk to the door**: both agents walk to the agreed `door_id`.
  3. **Confirm arrival**: after arriving, send a message confirming you are at the door. You must check your last action is walk to the right door id.
  4. **Handover and receive on the same step**:
     - The giver uses `handover` (parameter_1 = held object, parameter_2 = receiver agent name).
     - The receiver uses `receive`.
  5. **If handover fails**: do NOT retry blindly. Communicate and walk to the right door again first, then retry.

  ### Important rules
  - Both giver and receiver must walk to the door before handover. No other actions after walk to the door except wait/receive on the receiver side and handover on the giver side.
  - You are confirmed to be at the handover door ONLY if your latest successful movement to the handover point was `walk` to the agreed `door_id`, and you have not done any other walk/grab/open/put action after that.
  - If you performed any walk/grab/open/put action after reaching the handover door, you must walk to the agreed `door_id` again before receiving or handing over.
  - If handover fails with "too far", both the giver and receiver must walk to the agreed valid `door_id` again on the next step. Do not assign or choose `receive`, `handover`, `grab`, `put`, or `open` until both sides have re-walked to the door.
  - Do NOT walk away from the door if you are in the process of handover once you arrived.

PLAN_BLOCK_PHYSICAL_ACTIONS_UNRESTRICTED: |
  ## Physical Actions

  ### Valid Actions
  - put one object you are holding on a surface or into a container
  - open an enclosure
  - grab an object
  - walk to something visible
  - walk to another room (allowed rooms: $ALLOWED_ROOMS$)

  ### Interaction Rules
  - When an action involves any object, specify the name and a clear visual/location description.
  - You may interact (walk to, grab, put, open) with objects ONLY when they are currently visible.
  - If the object is not visible, first walk to the room includes it. If still occluded, walk to a nearby visible landmark (e.g., table/counter) until the target becomes visible.
  - You can hold at most TWO objects at the same time. If both hands are full, put one object down before grabbing another object or opening an enclosure.
  - Do NOT repeat a failed action unless the environment has changed. Do NOT repeating the same action consecutively.
  - You may walk directly to any room using the room name except the current one.

  ## ACTION Output Format

  Output a single JSON object, with no extra text:
  {
    "action": "<one of: walk / walk_to_room / grab / put_in / put_on / open >",
    "parameter_1": {"name": "<class name>", "description": "<short description>"} | null,
    "parameter_2": {"name": "<class name>", "description": "<short description>"} | null,
    "room": "<bedroom|livingroom|kitchen|bathroom>" | null
  }

  Parameter rules:
  - walk/open/grab: use "parameter_1" only.
  - put_in/put_on: "parameter_1" = held object, "parameter_2" = container/surface.
  - walk_to_room: set "room" and set both parameters to null.
  - Actions with no parameters: set "parameter_1", "parameter_2", and "room" to null.

PLAN_BLOCK_PHYSICAL_ACTIONS_RESTRICTED: |
  ## Physical Actions

  ### Valid Actions
  - put one object you are holding on a surface or into a container
  - open an enclosure
  - grab an object
  - walk to something visible (including doors — use door_id when walking to a door)
  - walk to another room (allowed rooms: $ALLOWED_ROOMS$)
  - handover: give one object you are holding to another agent ($OTHER_NAMES$). You must be at the door if in different rooms.
  - receive: wait to accept an object from another agent. Use this when the giver is about to handover. Also use this to stay at the door while waiting for the other agent to arrive (You should be walk to the door first to make sure you are at the door).

  ### Interaction Rules
  - When an action involves any object, specify the name and a clear visual/location description.
  - You may interact (walk to, grab, put, open) with objects ONLY when they are currently visible and in your allowed rooms.
  - If the object is not visible, first walk to the room that includes it. If still occluded, walk to a nearby visible landmark (e.g., table/counter) until the target becomes visible.
  - You can hold at most TWO objects at the same time. If both hands are full, put one object down before grabbing another object or opening an enclosure.
  - Do NOT repeat a failed action unless the environment has changed.
  - You may walk directly to any allowed room, except the current one. You cannot move to rooms that are not allowed.

  ### Handover Rules
  - Cross-room handover is valid ONLY when both agents are at the connecting door.
  - Walk to the door FIRST, then communicate to confirm both sides are ready.
  - The giver uses `handover` and the receiver uses `receive` on the **same step**.
  - After arriving at the door, do NOT walk away. Use `receive` to wait in place until the other agent arrives.
  - Use `receive` only when your latest successful movement to the handover point was `walk` to the agreed door_id and you have not done any walk/grab/open/put action since then.
  - If handover fails ("too far"), communicate to verify positions and retry. Both agents should walk to the door first before start the handover and receive.(the last action should be walk to the door)

  ## ACTION Output Format

  Output a single JSON object, with no extra text:
  {
    "action": "<one of: walk / walk_to_room / grab / put_in / put_on / open / handover / receive>",
    "parameter_1": {"name": "<class name>", "description": "<short description>"} | null,
    "parameter_2": {"name": "<class name or agent name>", "description": "<short description>"} | null,
    "room": "<bedroom|livingroom|kitchen|bathroom>" | null,
    "door_id": <integer> | null
  }

  Parameter rules:
  - walk/open/grab: use "parameter_1" only. If walking to a door, set "parameter_1" to {"name": "door", "description": "<short description>"} and set "door_id" to the door id.
  - put_in/put_on: "parameter_1" = held object, "parameter_2" = container/surface.
  - handover: "parameter_1" = held object, "parameter_2" = {"name": "<receiver agent name>", "description": "receiver agent"}.
  - receive: set "parameter_1", "parameter_2", "room", and "door_id" ALL to null.
  - walk_to_room: set "room" only, set all other fields to null.
  - Actions with no parameters: set "parameter_1", "parameter_2", "room", and "door_id" to null.

PLAN_BLOCK_MEMORY_SINGLE: |
  ## Memory Update

  ### Rules:
  - Store only task-relevant objects, containers, and target locations.
  - Update memory using the current observation, executed actions and feedback.
  - If new information conflicts with existing memory, correct the memory to reflect the latest belief.
  - Keep memory concise and consistent. Memory represents the current belief state, not a full history. Do not invent objects.

  ### MEMORY Output format
  Memory MUST be a JSON object with no extra text:
  {
    "livingroom": {
      "exploration": "unexplored|partially_explored|explored",
      "objects": [{"name": "...", "description": "...", "location": "...", "status": "..."}],
      "containers": [{"name": "...", "description": "...", "location": "...", "status": "unchecked|checked|open|closed"}],
      "notes": []
    },
    "kitchen": { ... },
    "bedroom": { ... },
    "bathroom": { ... },
    "global": {
      "notes": []
    }
  }

